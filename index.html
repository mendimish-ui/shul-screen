<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסך בית הכנסת</title>
<!--
  Screen 2 for the shul's Samsung TV (Tizen 6.0).

  WHY THIS PAGE EXISTS, and why it is not the main board:
  The board itself uses CSS subgrid (Chrome 117+, Sept 2023) and 87 clamp() calls. The TV's
  browser is built on Chrome from around 2020 and Samsung never updates it, so the board's
  markup arrives intact and then fails to lay out -- content scattered, times clipped. Proven
  on the real TV, 2026-10-27. So this is a separate, deliberately plain page.

  HARD CONSTRAINTS, all verified on that TV:
   - ES5 only: var, function, XMLHttpRequest. No fetch, arrow functions, template literals,
     const/let, Promise.
   - No CSS beyond ~2015: no grid, no clamp, no custom properties, no aspect-ratio. Plain
     block and absolute positioning, sizes in vw/vh, which that browser does handle.
   - No external fonts or libraries. Google Fonts may be unreachable without a VPN, and a
     half-loaded page would muddy every future diagnosis.

  WHERE THE VIDEOS COME FROM:
  bronnaya.com, which is the board's own Cloudflare Worker and R2 bucket -- confirmed
  reachable from the TV without a VPN. R2 charges nothing for egress, so a video looping
  24/7 costs nothing, whereas GitHub Pages caps at 100GB/month and forbids video hosting
  outright. The page is on GitHub (free, simple); only the heavy files come from R2.

  Palette taken from the board (website/src/app/globals.css) so the two screens look related.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f1b33; }
  body {
    color: #fdf6e6;
    font-family: "Noto Serif Hebrew", "David", Georgia, "Times New Roman", serif;
  }

  /* Header: name on the right, clock on the left. Plain block layout -- no flex gap, no grid. */
  #bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 11vh;
    background: #0f1b33;
    border-bottom: 1px solid rgba(201,153,47,0.45);
  }
  #barname {
    position: absolute;
    right: 2.5vw; top: 2.2vh;
    font-size: 4.4vh;
    font-weight: bold;
  }
  #clock {
    position: absolute;
    left: 2.5vw; top: 1.4vh;
    font-size: 6vh;
    font-weight: bold;
    letter-spacing: 0.02em;
    color: #e6c169;
  }
  #datum {
    position: absolute;
    left: 2.5vw; top: 8vh;
    font-size: 2.3vh;
    color: #c9a95f;
  }

  /* Video fills everything under the header. */
  #stage {
    position: absolute;
    top: 11vh; left: 0; right: 0; bottom: 0;
    background: #000;
  }
  video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  /* Caption strip over the bottom of the video, only when there is a caption. */
  #cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 2vh 3vw;
    background: #0f1b33;
    font-size: 3.4vh;
    text-align: center;
    display: none;
  }

  /* Shown only when a video cannot be fetched. Deliberately quiet. */
  #msg {
    position: absolute;
    left: 0; right: 0; top: 40%;
    text-align: center;
    font-size: 4vh;
    color: #c9a95f;
    display: none;
  }
  #mark {
    position: absolute;
    top: 1.2vh; left: 1.5vw;
    font-size: 2vh;
    color: #fdf6e6;
    opacity: 0.5;
    display: none;
  }
</style>
</head>
<body>

<div id="bar">
  <div id="barname">בית הכנסת</div>
  <div id="clock">--:--:--</div>
  <div id="datum"></div>
</div>
<div id="mark">אין חיבור</div>

<div id="stage">
  <video id="vid" muted playsinline autoplay preload="auto"></video>
  <div id="msg">הסרטון נטען…</div>
  <div id="cap"></div>
</div>

<script>
/* ES5 only -- see the note at the top of this file. */
(function () {
  "use strict";

  /* The board's own origin. Videos are served from here, not from GitHub: R2 has no egress
     charge, while GitHub Pages caps at 100GB/month. Confirmed reachable from the TV. */
  var MEDIA = "https://bronnaya.com";

  var PLAYLIST_URL = "playlist.json";
  var PLAYLIST_REFRESH_MS = 120000;

  var vid = document.getElementById("vid");
  var msg = document.getElementById("msg");
  var cap = document.getElementById("cap");
  var mark = document.getElementById("mark");
  var clockEl = document.getElementById("clock");
  var datumEl = document.getElementById("datum");

  var items = [];
  var at = 0;
  var failures = 0;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* Runs off the TV's own clock, so the screen stays visibly alive through any outage. */
  function tick() {
    var d = new Date();
    clockEl.innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    var days = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
    datumEl.innerHTML = "יום " + days[d.getDay()] + " · " +
      pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();
  }

  function setText(el, text) {
    el.innerHTML = "";
    if (text) { el.appendChild(document.createTextNode(text)); }
  }

  function show(el, on) { el.style.display = on ? "block" : "none"; }

  function playAt(i) {
    if (items.length === 0) {
      setText(msg, "אין סרטונים להצגה");
      show(msg, true);
      return;
    }
    at = i % items.length;
    var item = items[at];
    var url = item.url;
    /* A relative path means "from the board's origin"; a full URL is used as given, so a
       video can also be hosted elsewhere later without changing this page. */
    if (url.indexOf("http") !== 0) { url = MEDIA + url; }
    show(msg, false);
    setText(cap, item.caption || "");
    show(cap, !!item.caption);
    vid.src = url;
    try { vid.load(); } catch (e) {}
    var p = vid.play();
    if (p && typeof p.catch === "function") { p.catch(function () {}); }
  }

  function next() { playAt(at + 1); }

  vid.addEventListener("ended", next);
  /* A video that cannot load must not stop the rotation -- move on after a moment rather
     than sitting on a black screen, which is what an unattended wall display must never do. */
  vid.addEventListener("error", function () {
    setText(msg, "מדלג…");
    show(msg, true);
    setTimeout(next, 3000);
  });
  vid.addEventListener("playing", function () { show(msg, false); });
  /* A clip that stalls mid-play (the link went down) is given 20s, then skipped. */
  var lastTime = 0;
  var stalls = 0;
  setInterval(function () {
    if (vid.paused || vid.ended) { return; }
    if (vid.currentTime > lastTime) { lastTime = vid.currentTime; stalls = 0; return; }
    stalls++;
    if (stalls >= 20) { stalls = 0; next(); }
  }, 1000);

  function loadPlaylist() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", PLAYLIST_URL + "?t=" + (new Date()).getTime(), true);
    xhr.timeout = 15000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      var data = null;
      if (xhr.status >= 200 && xhr.status < 300) {
        try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      }
      if (data && data.items && data.items.length) {
        failures = 0;
        show(mark, false);
        var wasEmpty = items.length === 0;
        /* Replaced wholesale, so removing an item from the file removes it from the screen. */
        items = data.items;
        try { localStorage.setItem("screen2-playlist", xhr.responseText); } catch (e) {}
        if (wasEmpty) { playAt(0); }
        return;
      }
      failures++;
      if (failures >= 2) { show(mark, true); }
    };
    xhr.onerror = xhr.ontimeout = function () {
      failures++;
      if (failures >= 2) { show(mark, true); }
    };
    try { xhr.send(); } catch (e) {}
  }

  /* Last known playlist, so a reboot during an outage still has something to play. */
  try {
    var saved = localStorage.getItem("screen2-playlist");
    if (saved) {
      var d = JSON.parse(saved);
      if (d && d.items) { items = d.items; }
    }
  } catch (e) {}

  tick();
  setInterval(tick, 1000);
  if (items.length) { playAt(0); } else { setText(msg, "טוען…"); show(msg, true); }
  loadPlaylist();
  setInterval(loadPlaylist, PLAYLIST_REFRESH_MS);
})();
</script>

</body>
</html>
